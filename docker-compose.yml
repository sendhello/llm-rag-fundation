version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: VectorSearch.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      .env
    depends_on:
      - db

  db:
    image: pgvector/pgvector:pg17
    environment:
      - POSTGRES_ROOT_PASSWORD=qwe123
      - POSTGRES_DB=app
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=qwe123
    expose:
      - "5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql