[project]
name = "llm-rag-foundation"
version = "0.1.0"
description = ""
authors = [{ name = "Ivan Bazhenov", email = "bazhenov.in@gmail.com" }]
requires-python = ">=3.11,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "anthropic (>=0.103.1,<0.104.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "uvicorn (>=0.47.0,<0.48.0)",
    "openai (>=2.38.0,<3.0.0)",
    "voyageai (>=0.3.7,<0.4.0)",
    "pgvector (>=0.4.2,<0.5.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "uv (>=0.12.23,<0.13.0)",
    "greenlet>=3.5.1",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
